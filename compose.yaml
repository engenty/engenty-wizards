# Production: put a TLS proxy (Coolify/Traefik/Caddy) in front of port 8891 and set APP_URL.
services:
  wizards:
    build: .
    image: engenty-wizards:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: ${APP_URL:?set APP_URL to the public https origin}
    ports:
      - "8891:8891"
    volumes:
      - wizards-data:/data
    # The agent sandbox (shell/code tools) starts one container per run through the host's
    # Docker. Mounting the socket gives this service control over the host's Docker — only
    # enable it on a host dedicated to this app.
    #   environment: { SANDBOX_ENABLED: "1", SANDBOX_IMAGE: "ghcr.io/engenty/engenty-sandbox:latest" }
    #   volumes: [ "/var/run/docker.sock:/var/run/docker.sock" ]
volumes:
  wizards-data:
