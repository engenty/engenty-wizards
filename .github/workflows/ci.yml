name: CI

# The checks of docs/development.md on every push to main, every pull request and every release
# tag. A push to main deploys nothing. On a release tag `v<version>` (pnpm release) the cloud
# runtime's images are built here beside the checks and pushed to GHCR; when both are green the
# images become `latest` and the branches `deploy/runtime` and `deploy/docs` move to the tag's
# commit, each when what it is built from changed. The server deploys what a branch points at
# (Coolify resources `runtime` and `docs`, Auto Deploy): the runtime by pulling its images
# (compose.cloud.yaml), the docs by building. No secret and no call to the server from here.
#   pnpm release                         # commit + tag vX.Y.Z, locally
#   git push origin main --follow-tags   # the tag is what deploys
# Run by hand on a tag (workflow_dispatch), it deploys that tag again.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # On main and on a tag a running check finishes, so every deploy is of a commit that passed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    # A release commit reaches main together with its tag: the tag's run checks that commit.
    if: >-
      ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'chore(release):')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The pnpm version is the `packageManager` of package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The docs site (apps/docs, docs/content) is not part of the product's build.
      - name: Docs
        run: pnpm build:docs

  # The cloud runtime's two images, built on GitHub's runners: the server only pulls them. The
  # layers come from the registry's cache, so a release rebuilds only what changed. Pushed under
  # the tag; `latest` follows in `deploy`, once the checks are green too.
  images:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: runtime
            file: apps/runtime/Dockerfile
          - image: browser
            file: deploy/Dockerfile.browser
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        timeout-minutes: 25
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/engenty/engenty-wizards-${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/engenty/engenty-wizards-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/engenty/engenty-wizards-${{ matrix.image }}:buildcache,mode=max

  deploy:
    needs: [verify, images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Every branch with its history: the step compares against the deploy branches.
          fetch-depth: 0

      - name: The tag is the version, on main
        run: |
          set -euo pipefail
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA^{commit}" origin/main

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What the server pulls (compose.cloud.yaml): the release's images, checked and built.
      - name: The release's images become latest
        run: |
          set -euo pipefail
          for image in runtime browser; do
            ref="ghcr.io/engenty/engenty-wizards-$image"
            docker buildx imagetools create --tag "$ref:latest" "$ref:$GITHUB_REF_NAME"
          done

      - name: Move the deploy branches
        run: |
          set -euo pipefail
          # The commit the tag points at.
          commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          # move <branch> <path>...: the paths are what the resource is built from.
          move() {
            local branch=$1
            shift
            if git rev-parse --quiet --verify "origin/$branch" >/dev/null; then
              if ! git merge-base --is-ancestor "origin/$branch" "$commit"; then
                echo "$branch is not behind this commit (moved by hand, or a newer run was first): left as it is."
                return
              fi
              if git diff --quiet "origin/$branch" "$commit" -- "$@"; then
                echo "$branch: nothing it is built from changed since $(git rev-parse --short "origin/$branch"): no deploy."
                return
              fi
            fi
            git push origin "$commit:refs/heads/$branch"
            echo "$branch now at $(git rev-parse --short "$commit"): the server deploys it."
          }
          # The runtime: compose.cloud.yaml with the two images (apps/runtime/Dockerfile,
          # deploy/Dockerfile.browser) built above.
          move deploy/runtime apps/runtime apps/web packages modules plugin deploy \
            compose.cloud.yaml .dockerignore \
            package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json \
            ':(exclude)apps/runtime/test'
          # The documentation site (apps/docs/Dockerfile). The root package.json is left out: its
          # version changes with every release, the site with its pages.
          move deploy/docs apps/docs docs/content docs/assets \
            pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json
