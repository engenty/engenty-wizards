name: Release

# A tag `v<version>` (the version of the root package.json) publishes what a local install is made
# of on the GitHub release: the package `wizards` as a tarball. The installer
# (apps/web/public/install.sh) fetches it from there. People install the studio as a Chrome app.
# The installer itself reaches engenty.ai with the deploy the same tag starts (ci.yml).
#
# The package also goes to npm, for `npx wizards`, while the repository variable PUBLISH_NPM is
# `true` and the secret NPM_TOKEN holds a token that may publish `wizards` without a second factor.
# On a pull request that touches what a local install is made of, and run by hand
# (workflow_dispatch), it builds and tests everything and publishes nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - apps/runtime/**
      - apps/web/public/install.sh
      - packages/**
      - bin/**
      - scripts/npm-package.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Apple Intelligence as a model (apps/runtime/src/harness/apple.ts) runs through a Swift helper
  # that only a Mac with the macOS 26 SDK builds; the package made on Linux takes it from here.
  apple:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build wizards-apple
        run: node apps/runtime/scripts/build-apple.mjs --force
      - uses: actions/upload-artifact@v7
        with:
          name: apple-helper
          path: apps/runtime/dist/apple/wizards-apple
          if-no-files-found: error

  package:
    needs: apple
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apple-helper
          path: dist/apple-helper
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Pack
        run: node scripts/npm-package.mjs --apple dist/apple-helper/wizards-apple

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/npm/*.tgz
          if-no-files-found: error

  # The installer, as a person runs it, with the package of this commit instead of the registry's:
  # its own Node, the runtime, the command, then a start that answers.
  installer:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist/npm

      - name: Lint the installer
        if: runner.os == 'Linux'
        run: shellcheck apps/web/public/install.sh

      - name: Install
        run: |
          set -euo pipefail
          export ENGENTY_HOME="$RUNNER_TEMP/engenty"
          ENGENTY_WIZARDS_PACKAGE="$(ls "$PWD"/dist/npm/*.tgz)" bash apps/web/public/install.sh --yes --no-link
          echo "ENGENTY_HOME=$ENGENTY_HOME" >> "$GITHUB_ENV"

      - name: Start, enter, stop
        run: |
          set -euo pipefail
          wizards="$ENGENTY_HOME/wizards/bin/wizards"
          "$wizards" doctor
          "$wizards" start --no-open > start.log 2>&1 &
          for _ in $(seq 1 120); do grep -q "is running" start.log && break; sleep 0.5; done
          cat start.log
          # A ticket lets a browser into the runtime that runs: 302 to the studio.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$("$wizards" open --print)")" = 302
          "$wizards" stop

  publish:
    needs: [package, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: artifacts/npm-package
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: GitHub release with the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            artifacts/npm-package/*.tgz

      - name: npm
        if: vars.PUBLISH_NPM == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish artifacts/npm-package/*.tgz --access public
