<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>engenty wizards</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <main id="app" hidden>
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true">
        <path fill="#e0531b" d="M60 22 Q96 26 96 62 Q96 96 60 100 Q24 96 24 62 Q24 26 60 22 Z" />
        <ellipse cx="50" cy="58" rx="7" ry="8" fill="#fff" />
        <ellipse cx="72" cy="58" rx="7" ry="8" fill="#fff" />
        <circle cx="51" cy="60" r="3.4" fill="#1d1a17" />
        <circle cx="73" cy="60" r="3.4" fill="#1d1a17" />
      </svg>
      <h1>engenty wizards</h1>

      <!-- The runtime on this machine is being installed or is starting, or a remote server is being reached. -->
      <section id="wait" hidden>
        <p id="wait-text" class="muted"></p>
        <div class="spinner" role="progressbar"></div>
        <pre id="wait-progress" hidden></pre>
      </section>

      <!-- First start and "Server wechseln…". -->
      <form id="choose" hidden>
        <p id="choose-lead" class="muted"></p>
        <label class="option">
          <input type="radio" name="kind" value="local" />
          <span>
            <strong id="local-title"></strong>
            <small id="local-hint"></small>
          </span>
        </label>
        <label class="option">
          <input type="radio" name="kind" value="custom" />
          <span>
            <strong id="custom-title"></strong>
            <small id="custom-hint"></small>
            <input id="custom-url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://wizards.example.com" />
          </span>
        </label>
        <label class="option">
          <input type="radio" name="kind" value="cloud" />
          <span>
            <strong id="cloud-title"></strong>
            <small id="cloud-hint"></small>
          </span>
        </label>
        <p id="choose-error" class="error" hidden></p>
        <button id="choose-go" type="submit" class="primary"></button>
      </form>

      <!-- The runtime on this machine was not installed or did not start, or a remote server cannot be reached. -->
      <section id="failed" hidden>
        <p id="failed-text" class="error"></p>
        <pre id="failed-log" hidden></pre>
        <div class="row">
          <button id="failed-retry" type="button" class="primary"></button>
          <button id="failed-logs" type="button"></button>
          <button id="failed-choose" type="button"></button>
        </div>
      </section>

      <footer id="version" class="muted"></footer>
    </main>
    <script src="shell.js"></script>
  </body>
</html>
